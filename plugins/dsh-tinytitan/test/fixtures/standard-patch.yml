# A miniature of the shipped `standard` composition as a 0.2.0 bundle patch:
# one insert holding the `preset-standard` declaration. The real file is
# `@deepseek-ai/dsh-web-app/presets/standard.patch.yml`; this fixture pins the
# shape `buildTinytitanPlugins` consumes — a chat-noise row, a `!!js` disabled
# expression, and a nested `compaction` group.
- insert:
    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        name: Standard
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
