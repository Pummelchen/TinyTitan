# One-shot diagnostic for the xcode-27 runner: workflow_dispatch only, no
# schedule, no push trigger. Second round: run 38136569050 shows the storm
# fixture failing with the SAME statuses (every helper 134, "Abort trap: 6")
# even though the suite now compiles a real dylib and the new Mach-O pin test
# passed on that run. So dyld on this runner rejects more than a text file —
# this probe asks what: it inserts a minimal compiled dylib directly, and
# reruns the storm fixture with a compiled runtime, printing the binary's
# file/codesign facts and EVERY run log (the suite's tearDown deletes them).
# Delete after diagnosis.
name: tsan-fixture-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Environment facts
        run: |
          echo "--- uname ---"; uname -m
          echo "--- sw_vers ---"; sw_vers
          echo "--- csrutil ---"; csrutil status || true
          echo "--- clang ---"; clang --version | head -2
          echo "--- which env bash clang ---"
          which -a env bash clang | head -8

      - name: Does env keep DYLD_INSERT_LIBRARIES?
        run: |
          echo "not-a-dylib" > /tmp/fake_dylib.txt
          set +e
          out="$(DYLD_INSERT_LIBRARIES=/tmp/fake_dylib.txt /usr/bin/env sh -c 'echo kept; echo "var=[$DYLD_INSERT_LIBRARIES]"' 2>&1)"
          rc=$?
          echo "rc=$rc"
          echo "output: [$out]"

      - name: Minimal dyld insert of a compiled dylib
        run: |
          set +e
          tmp="$(mktemp -d)"
          cat > "$tmp/s.c" <<'EOF'
          int tinytitan_probe_symbol;
          EOF
          clang -dynamiclib "$tmp/s.c" -o "$tmp/s.dylib"
          echo "clang rc=$?"
          file "$tmp/s.dylib"
          codesign -dv "$tmp/s.dylib" 2>&1 | head -6
          out="$(DYLD_INSERT_LIBRARIES="$tmp/s.dylib" /usr/bin/env sh -c 'echo inserted-ok; echo "var=[$DYLD_INSERT_LIBRARIES]"' 2>&1)"
          echo "insert rc=$?"
          echo "output: [$out]"
          # The same insert into bash, the helper's actual interpreter.
          out="$(DYLD_INSERT_LIBRARIES="$tmp/s.dylib" /bin/bash -c 'echo bash-inserted-ok' 2>&1)"
          echo "bash insert rc=$?"
          echo "output: [$out]"

      - name: The fixture storm with a compiled runtime, full output
        run: |
          set +e
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/bin" "$tmp/tools"
          sdk="$tmp/sdk"
          helper="$sdk/Toolchains/XcodeDefault.xctoolchain/usr/libexec/swift/pm/swiftpm-testing-helper"
          mkdir -p "$(dirname "$helper")"
          cat > "$helper" <<'EOF'
          #!/usr/bin/env bash
          mode="$(cat "$MODE_FILE")"
          case "$mode" in
            refuse) exit 69 ;;
            report) echo "WARNING: ThreadSanitizer: data race (pid=1234)"; exit 66 ;;
            *) echo "Test run with 117 tests passed"; exit 0 ;;
          esac
          EOF
          chmod 755 "$helper"
          mkdir -p "$sdk/Platforms/MacOSX.platform/Developer/Library/Frameworks/XCTest.framework" \
                   "$sdk/Platforms/MacOSX.platform/Developer/usr/lib"
          printf '#!/usr/bin/env bash\necho "%s"\n' "$sdk" > "$tmp/bin/xcode-select"
          chmod 755 "$tmp/bin/xcode-select"
          mkdir -p "$tmp/.build/out/Products/Debug/TinyTitanServerTests.xctest/Contents/MacOS"
          printf '#!/usr/bin/env bash\nexit 0\n' > "$tmp/.build/out/Products/Debug/TinyTitanServerTests.xctest/Contents/MacOS/TinyTitanServerTests"
          chmod 755 "$tmp/.build/out/Products/Debug/TinyTitanServerTests.xctest/Contents/MacOS/TinyTitanServerTests"
          runtime="$tmp/.build/out/Products/Debug/TinyTitanServerTests.xctest/Contents/Frameworks/libclang_rt.tsan_osx_dynamic.dylib"
          mkdir -p "$(dirname "$runtime")"
          cat > "$tmp/stub.c" <<'EOF'
          int tinytitan_stub_tsan_runtime;
          EOF
          clang -dynamiclib "$tmp/stub.c" -o "$runtime"
          echo "runtime build rc=$?"
          file "$runtime"
          codesign -dv "$runtime" 2>&1 | head -4
          cp tools/tsan-storm.sh tools/tsan-suppressions.txt "$tmp/tools/"
          for spec in "pass 2 1" "refuse 1 1" "report 1 1"; do
            set -- $spec
            mode="$1"; runs="$2"; parallel="$3"
            echo "$mode" > "$tmp/mode"
            PATH="$tmp/bin:$PATH" MODE_FILE="$tmp/mode" TMPDIR="$tmp" \
              /bin/bash "$tmp/tools/tsan-storm.sh" --runs "$runs" --parallel "$parallel" \
              > "$tmp/out" 2> "$tmp/err"
            rc=$?
            echo "=== mode=$mode rc=$rc ==="
            echo "--- stdout ---"; cat "$tmp/out"
            echo "--- stderr ---"; cat "$tmp/err"
            echo "--- statuses ---"; cat "$tmp"/tt-tsan-storm.*/statuses 2>/dev/null || echo "(no statuses file)"
            for f in "$tmp"/tt-tsan-storm.*/run-*.log; do
              echo "--- log ${f##*/} ---"; cat "$f"
            done
            rm -rf "$tmp"/tt-tsan-storm.*
          done
