name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The Python floor the scripts are written to and that `tools/lint.sh`
          # verifies by parsing every file at this version. Without this, the
          # interpreter was "whatever the runner happens to ship".
          python-version: '3.13'
      - name: Install the pinned Python linter
        # `tools/lint.sh python` needs the exact pinned ruff and FAILS rather
        # than skipping when it is missing, so CI installs it here. The version
        # is the one in the gate's RUFF_PIN.
        run: |
          python3 -m pip install --user --disable-pip-version-check --quiet ruff==0.16.7
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      - name: Install the converter's pinned dependencies
        # `tools/lint.sh`'s converter gate probes the expert-fusion path in
        # `tools/prepare_agentworld.py`, and FAILS rather than skipping when
        # `numpy` or the module is missing: a check that did not run must not
        # read as a pass. The same pins the converter suites use, from the same
        # file, so the probe and the gates below run the same code paths.
        run: |
          python3 -m pip install --user --disable-pip-version-check --quiet \
            -r benchmark/requirements.txt
      - name: Install the pinned shell linter
        # `tools/lint.sh`'s shellcheck gate pins 0.11.0 and fails when another
        # version is present; Homebrew cannot pin, so the release binary is
        # downloaded. The scripts it checks are the installer, the launcher and
        # the release tooling.
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.aarch64.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          echo "/tmp/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Install the pinned Swift linter
        # `tools/lint.sh`'s swiftlint gate pins 0.65.1 because the rule set moves
        # between releases, and Homebrew cannot pin. The committed
        # `.swiftlint.yml` is the standard the gate enforces with `--strict`.
        run: |
          curl -fsSL -o /tmp/swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint-0.65.1
          echo "/tmp/swiftlint-0.65.1" >> "$GITHUB_PATH"
      - name: Plugin tests (harness-version pins)
        # The cheapest gate, and independent of the Swift build: the plugin
        # suites run in about a second together. dsh-tinytitan asserts the one
        # harness release it supports against both its `package.json` peer pins
        # and the launcher's pin in `tools/dsh_local.sh`, so drift in either
        # fails here in seconds rather than at a user's boot.
        run: |
          for plugin in plugins/dsh-*; do
            [ -d "$plugin/test" ] || continue
            echo "::group::$plugin"
            (cd "$plugin" && node --test test/*.test.js)
            echo "::endgroup::"
          done
      - name: Install the pinned JS toolchain
        # `tools/lint.sh`'s javascript gate needs each plugin package's own
        # eslint/prettier and FAILS when they are missing or a different
        # version, so CI installs them from the committed package-lock.json
        # (`npm ci`, not `npm install`: the lockfile is the pin).
        run: |
          for plugin in plugins/dsh-*; do
            [ -f "$plugin/package.json" ] || continue
            echo "::group::$plugin"
            (cd "$plugin" && npm ci --no-audit --no-fund)
            echo "::endgroup::"
          done
      - name: Build release products (0 warnings gate)
        run: |
          swift build -c release 2>&1 | tee /tmp/build.log
          # Match compiler diagnostics only (file:line:col: warning:). A bare
          # `grep warning:` also catches SwiftPM dependency-resolution notices
          # such as "warning: 'swift-system': skipping cache due to an error",
          # which would fail the gate with a misleading message.
          if grep -qE '^[^ ]+\.(swift|metal|c|h|m|mm):[0-9]+:[0-9]+: warning:' /tmp/build.log; then
            echo "::error::build emitted warnings; CI requires a warning-free release build"
            grep -E '^[^ ]+\.(swift|metal|c|h|m|mm):[0-9]+:[0-9]+: warning:' /tmp/build.log
            exit 1
          fi
      - name: The arm64 promise (RELEASE.md rule 2)
        # `tools/release.sh` asserts this over the archives it publishes, but a
        # release is cut from one machine while CI is the only place that builds a
        # clean clone on the pinned toolchain. The four products a release would
        # stage are checked here, immediately after the build and before the gates
        # that cost minutes: an arch that is not `arm64` stops the run, not the
        # release.
        run: |
          tools/assert-arch.sh \
            .build/release/TinyTitanServer \
            .build/release/TinyTitanCLI \
            .build/release/TinyTitanRepack \
            .build/release/TinyTitanBench
      - name: Production gates (every check in tools/lint.sh's all chain)
        # Checks the compiler cannot express. Runs before the suite so a style
        # regression fails in seconds rather than after a full test run. The
        # step names no count on purpose: a number here is a second list of the
        # gates, and the last time one was added both it and `tools/lint.sh`'s
        # own header drifted out of date.
        run: tools/lint.sh
      - name: The package is consumable as a dependency
        # `examples/embedded` is a package that is not this repository: it depends
        # on this one and links the engine. SwiftPM can refuse to consume a
        # package carrying unsafe build flags — this one does, deliberately, for
        # `-warnings-as-errors` and the `-O2` C kernels — and whether it still
        # refuses is a property of the toolchain rather than of this file, so the
        # check builds the real thing instead of asserting it. See
        # docs/plan-embedded-library.md §2 and §6.
        run: tools/embedded-dependency-check.sh
      - name: Converter gates (synthetic checkpoint, fault injection)
        # `tools/prepare_qwen38.py` converts a 360 GB checkpoint. The unit suite
        # pins its pieces; the end-to-end suite runs `main()` against a
        # synthetic one served from 127.0.0.1 (real curl downloads, injected
        # transport failures, a killed process, a table copied across a disk
        # image) and requires every recovery to produce the clean-run snapshot.
        # The same venv runs `tools/prepare_agentworld.py`'s unit suite, which
        # covers the Qwen3.5-MoE per-expert fusion at both widths from a
        # synthetic in-memory shard (issue #19).
        # The fourth suite is `tinytitan_quant_fidelity.py`, the dequantise-and-
        # compare checker that says whether a quantised build is faithful to the
        # official one. It lives here rather than in the model-free step because
        # it imports numpy, which only this venv carries. Its own tests fake
        # `fetch()` with in-memory arrays, so no checkpoint and no model is ever
        # read, and no shard is downloaded.
        # Measured on this Mac with the four suites together: 100 tests, 36.6 s.
        # A venv because the runner does not carry the converter's three
        # dependencies. No real shard is ever fetched.
        run: |
          python3 -m venv /tmp/tt-converter
          /tmp/tt-converter/bin/pip install --quiet --disable-pip-version-check \
            -r benchmark/requirements.txt
          cd benchmark
          /tmp/tt-converter/bin/python -m unittest test_prepare_qwen38 test_qwen38_resume_e2e \
            test_prepare_agentworld test_tinytitan_quant_fidelity
      - name: Installer and launcher gates (private DSH isolation, model-menu and launcher choices)
        # The installer and `tools/dsh_local.sh` promise a factory-new Mac stays
        # untouched: one private root, no PATH or shell-rc edit, and npm, pnpm and
        # the XDG caches redirected into it. These tests pin that contract —
        # static checks plus a dry run that must write nothing — and the model
        # menu's answer handling (an EOF must not start the recommended
        # download). `test_install_models_batch_status` pins what the batch modes'
        # exit status means: both loops used to end on the row filter's own test,
        # so `--all-8bit` exited 0 with a model it had refused and `--all-4bit`
        # exited 1 with nothing missing (AUD-253). It drives the dispatcher's own
        # branch text with `install_one` stubbed, so it installs nothing.
        # `test_repack_dense_gate_verdict` pins the other installer gate's verdict:
        # `tools/repack_dense.sh` step 5 is the only step that proves the `.ssdai`
        # reader interprets the bytes, and `swift test` exits 0 both when a `--filter`
        # matches no test and when every test of a model-gated suite skipped (AUD-261).
        # It feeds the script's own verdict function canned logs, so it starts no model
        # and runs no test target.
        # `test_release_test_gate` pins the release's own test gate: `swift test` prints one
        # summary line per test target -- seven here -- so `grep -q 'Test run with .* passed'`
        # was satisfied by one passing target while six reported failures, and the `|| true`
        # threw away the status that knew (AUD-262). It drives the script's extracted verdict
        # function over the seven real lines and a constructed mix, so it runs no test target.
        # `test_release_notes_compact` pins the sole author of the published Release notes:
        # `tools/compact-release-notes.py` re-laid fenced examples, tables and blockquotes into
        # one sentence each, which is the claim destroyed rather than re-wrapped, and
        # release.sh's `--require` token grep could not see it because every token survived the
        # merge (AUD-263). It runs the real script over fixtures and every committed
        # `docs/release-notes-v*.md`, so it publishes nothing and needs no network.
        # `test_launcher_install` pins the launcher's own fetch path:
        # the stem-to-catalogue-key map, and that neither a pipe nor `--dry-run`
        # can start a download. `test_progress` pins the line those downloads
        # draw. The two verification suites are the fail-closed half of the same
        # promise: every artifact this repository downloads and then executes —
        # the engine archive, the tools archive, the private Node — is checked
        # against a published digest first, and each branch that cannot prove the
        # bytes must stop the install. They drive the real scripts against a stub
        # `curl`, so they fetch nothing and need no token. None needs dependencies
        # beyond the runner's python3.
        # The six `test_launcher_*`/`test_coder_clients`/`test_tinytitan_profile`
        # suites are the launcher's own arithmetic — the RAM half and its warning
        # boundary, the port's three ways in, the concurrency width and its red
        # warning, the client catalogue, the benchmark profile's server command,
        # and the lifetime of the server it starts (a stub binary through
        # `TINYTITAN_BIN_DIR`, so the suite proves the model dies with the
        # launcher without loading one). They name their model through
        # `launcher_fixture`, which turns `tools/testdata/catalog-example.json`
        # into empty directories under a temporary `models/`: a runner has no
        # install by policy and none may be
        # fetched to satisfy a gate, so before that seam existed these suites
        # skipped here — 47 of the 59 tests on an install-free tree — and the
        # launcher's rules were checked on no machine at all. `launcher_fixture`
        # runs its own invariants so a fixture that stopped standing in for an
        # install fails rather than quietly skipping again.
        run: |
          cd benchmark
          python3 -m unittest test_dsh_isolation test_dsh_route test_install_models_menu \
            test_install_models_batch_status test_repack_dense_gate_verdict \
            test_release_test_gate test_release_notes_compact \
            test_launcher_install test_launcher_ram test_launcher_port \
            test_launcher_concurrency test_launcher_lifetime test_coder_clients \
            test_tinytitan_profile \
            launcher_fixture test_progress \
            test_release_installer_verification test_dsh_node_digest test_supply_chain
      - name: Release gates (the CI-green precondition)
        # `tools/ci-green.sh` is what stops a tag going out over a commit whose CI
        # has not passed — the gap that let v5.18 publish an hour after its own
        # tag commit failed the Installer gates job. These tests drive it with a
        # stubbed `gh`, so they need no token and no network, and they cover the
        # shapes that would otherwise let a vacuous pass through: a commit with no
        # run at all, a short sha the API matches against nothing, a run still in
        # flight, and the override with and without its reason.
        run: |
          cd benchmark
          python3 -m unittest test_release_ci_green
      - name: Golden-baseline capture gates
        # `tools/golden-baseline.sh --check` is the only gate that exercises real
        # inference, and `tools/release.sh` runs it before a tag — so the capture
        # arm that writes the stored baselines has to be able to fail. These
        # tests drive it with a stub CLI inside a temporary checkout: no model,
        # no GPU, no download. They cover the vacuous passes a capture can leave
        # behind (an empty run stored as a baseline, a baseline with an empty
        # body certified by an empty run), a write that cannot happen, and the
        # byte count the operator reads as proof a capture landed.
        run: |
          cd benchmark
          python3 -m unittest test_golden_baseline_capture
      - name: Docs-gate ledger evidence
        # The audit ledger is the record every fix is checked against, and its
        # `commit` field is the pointer a reader follows: `git show <sha>`. Nothing
        # read that field, and it had rotted in nine rows — one sha with no object
        # behind it, six whose field is prose, two that named nothing though
        # their fix is committed. These tests drive `tools/docs-facts.py` against a
        # temporary git repository, so each shape is reachable without touching this
        # history: a sha that does not exist, one that exists on an unmerged branch,
        # prose where a reference belongs, the blank that is allowed, and the
        # vacuous-pass shapes (a ledger with no rows, one that cannot be read).
        run: |
          cd benchmark
          python3 -m unittest test_docs_facts_ledger
      - name: Memory-matrix exit gates
        # `benchmark/memval_matrix.sh` is a day of twelve `memval_run.sh` arms and
        # its verdict is the exit code an operator or a script reads afterwards.
        # Each arm's status used to go only into its own log line, so the matrix
        # exited 0 however many arms failed. These tests drive a copy of it with a
        # stub `memval_run.sh` — no model, no server, no GPU — and pin that one
        # failed arm, every failed arm, the named summary, and the per-arm log line.
        # `test_memval_run_repeats` is the same shape one layer down: it drives a
        # copy of `memval_run.sh` with a stub launcher and no release binary, so a
        # count it refuses (AUD-246: `RUNS=0` made `seq 1 0` count *down* through
        # run 0 and still exit 0) cannot reach a server even if the guard slipped.
        run: |
          cd benchmark
          python3 -m unittest test_memval_matrix_exit test_memval_run_repeats
      - name: Benchmark and memory tooling gates (model-free)
        # AUD-211: these suites were committed, cited in commit messages as evidence,
        # and named in no CI step — so they ran on one laptop and on no machine that
        # gates a release. Except the 3-bit probe, whose fixture reads real tensor
        # bytes through numpy,
        # every one of them is stdlib-only, measured on this host
        # 2026-10-09 as 34 suites and 697 tests with no model, no server, no Xcode and
        # no third-party import (test_tsan_storm_exit stubs `xcode-select` and the
        # testing helper, so it exercises the storm's verdict without a built bundle,
        # test_memory_command_names runs each memory driver's own dispatch with a
        # bogus command word, which needs no port at all,
        # test_driver_documented_commands reads a driver's docstring against its
        # dispatch table, test_capital_of_paris_report renders the smartness page
        # from rows synthesized in a TemporaryDirectory, and
        # test_tinytitan_determinism_ab calls the pure verdict() over delta lists without
        # starting a server, and test_tinytitan_overlap_measure drives the real
        # main() with subprocess.Popen, the /health wait and the request loop all
        # faked, so the overlap driver's verdict is gated without a model and without
        # ever opening a port; test_tinytitan_rdadvise_ab does the same for the rdadvise
        # A/B, which until it existed started a model server per arm *at import*, and
        # test_tinytitan_gap_bisect for the length sweep, which started two of them and
        # printed both arms' empty sections under a header that claimed them, and
        # test_capital_of_paris_smartness drives the wiki page's own matrix with its
        # single request seam `post()` faked, so it checks the rows, the summary and the
        # exit status without opening a port, and
        # test_tinytitan_maxthroughput drives that driver's real main() with Popen, the
        # /health wait, the request loop, server_command() and the log path faked, so the
        # ladder's verdict is gated without a model — it exists because the driver
        # returned no status at all and froze its configuration at import, and
        # test_tinytitan_slots_ab does the same for the expert-cache-slot A/B, which
        # printed its arm header over three channels that held nothing and exited 0,
        # kept its only `sys.exit` inside the per-arm function so a dead arm ended the
        # sweep, and cast `TINYTITAN_AB_TOKENS` at import so an unparseable value made
        # the module unimportable;
        # test_tinytitan_longgen drives the long-generation driver's real main() with
        # Popen, the /health wait, the POST, resolve_api_model(), server_command() and the
        # log path faked — it exists because that driver averaged its warm-up into the
        # headline mean, printed `mean=0.00 tok/s` for an arm whose log held no footer and
        # returned no status at all, and sent 512-token requests to a server that had
        # never answered /health),
        # test_tinytitan_benchmark drives the benchmark cell's real main() with Popen,
        # the /health wait, the streaming POST, server_command(), resolve_api_model(),
        # bench_model() and the log and results paths faked — it exists because that
        # driver's matrix denominator was its survivors, so a cell where every prompt
        # failed printed `Answers verified: 0 of 0 rows` under a `COMPLETE` banner and
        # exited 0; because main() returned no status and the banner was unconditional;
        # because wait_ready() polled /health ten times without ever looking at the
        # process, so a server that had exited was reported as a failure and one that
        # was merely slow was declared dead; because it froze the model, the width
        # label and the MTP draft head at import; and because it joined the server's
        # decode footers to its rows by zip(), which shifts every rate after the first
        # missing one;
        # test_tinytitan_longctx drives the long-context driver's real main() with
        # Popen, wait_for_health(), server_command(), server_environment(),
        # resolve_api_model(), `ps`, the streaming POST, the log and results paths
        # faked, and time.time() stepped by hand -- it exists because that driver
        # printed `first-half=` for a window that was the second quarter of the run,
        # divided characters per second by a hardcoded 4.0 and called the result
        # tok/s, raised a TypeError on a stream whose usage chunk arrived with no
        # content delta, left its server holding the port whenever a request raised,
        # froze its install at `str(DEFAULT_MODEL_PATH)` so TINYTITAN_BENCH_MODEL was
        # ignored, polled /health for two minutes without ever looking at the process
        # it was waiting for, and returned no status at all.
        # test_memory_smoke drives the memory smoke check's real main() with
        # urlopen, time.sleep, the memory directory and the server log faked -- it
        # exists because that driver read the status of one request out of three, so
        # a 500 on the placement-isolation probe left an empty reply that cannot
        # contain the stored fact and the run printed `SMOKE OK` with exit 0; because
        # `if MEMDIR.exists():` skipped the journal section with no line at all, and
        # `Path(os.environ.get(..., ""))` is `Path('.')`, so a direct run scanned the
        # directory it launched from; because an unconfigured or missing server log was
        # reported as the model failing to consolidate after 180 s of sleeping; because
        # a refused connection was an uncaught URLError traceback; and because the
        # verdict rode on a `raise SystemExit(1)` inside main() while the guard
        # discarded whatever main() returned.
        # test_tinytitan_3bit_probe drives the 3-bit gate probe's real main()
        # against synthetic `.ssdai` installs it writes in a temp directory -- it
        # exists because that probe divided 3-bit's error by the 4-bit error of a
        # tensor that IS the stored 4-bit weights, which is 0.0 by construction,
        # and printed `median 3-bit/4-bit error ratio: 205600894987.58x` at exit
        # 0 while the rule its docstring offers ("an error several times 4-bit's
        # is a strong signal") can never fire against any input; because the six
        # tensors it sampled came out of `model_weights.bin`, which on this
        # repository's own MoE format holds none of the routed experts the
        # decision is about (512 experts per layer sit in
        # `packed_experts/layer_00.bin`, 1,417,674,752 bytes, against that file's
        # 51,681,440 and its four `mlp.shared_expert*` projections); because
        # `dequant4` assumed two nibbles per byte for every entry while the
        # manifest declares the router 8-bit; because the docstring's second
        # deciding question -- how much extra unpack work each weight costs -- was
        # never measured, and 3 bits does not divide a 32-bit word (6 crossings
        # per group of 64, 0.0938 extra loads per weight); and because `main()`
        # returned 0 on every path, the guard discarded it, and the install path
        # was frozen at import so `TINYTITAN_BENCH_MODEL` was a no-op. It reads
        # the weights through the repository's own `tools/ssdai_reader.py`, and is
        # the one suite in this list that imports a third-party module: numpy,
        # which the pinned converter requirements above already install.
        # test_tinytitan_ane_attention_probe drives the ANE full-attention probe's
        # real main() with `build_block` and `cpu_model_for` patched and
        # coremltools faked in `sys.modules` -- it exists because that probe quoted
        # a GPU reference of 4,215 ms per layer-chunk and never divided anything by
        # it, so the go/no-go it was written for was never computed and a 512-token
        # row printed `7.55 ms` directly under that number; because the reference is
        # an average over 20 layer-chunks of two *unequal* shapes (4096:0 then
        # 2007:4096), so both sides are now given in ms per 1k layer-tokens where
        # the reference is 1,381.3; because its numerics "sanity check" had no
        # criterion, so the default list exited 0 at a mean relative error of 0.0998
        # and a non-finite gap printed `nan`, wrote a literal NaN into the JSON
        # artifact (not RFC 8259) and still exited 0; because the CPU_ONLY arm sat
        # behind `if t <= 2048:` with no else, so the 4096 row printed no comparison
        # at all and its artifact line was indistinguishable from an errored arm, and
        # `round(cpu_ms, 2) if cpu_ms else None` turned a 0 ms measurement into the
        # same null; because `--repeats 0` died with IndexError after the model was
        # built and a malformed `--configs` was a bare ValueError; because one config
        # raising lost the whole artifact; because the artifact path resolved against
        # the working directory with no mkdir, so a run from /tmp printed every row
        # and then died with FileNotFoundError; and because `return 0` was the only
        # return in main() while the guard discarded it. Like the 3-bit probe it
        # imports numpy, and nothing else: coremltools is faked, so the real probe --
        # which needs the ANE and minutes per config -- is not what CI runs.
        # test_tinytitan_ane_realweight_rehearsal drives the real-weight ANE
        # rehearsal's real main() against synthetic `.ssdai` installs it writes in
        # a temp directory, with `build_block`, `reference`, `rope_tables`,
        # `causal_mask` and the probe's geometry constants patched and coremltools
        # faked in `sys.modules`. It exists because that rehearsal had no verdict
        # to fail: `return 0` was the only return in `main()`, the guard discarded
        # even that, and no line in the file compared the per-layer error to
        # anything, so a gap of NaN was a clean run. It hardcoded the
        # full-attention layers as `range(3, 40, 4)` where the manifest's
        # `fullAttentionLayerMask` on the installed 125B declares twelve; it froze
        # the install path at import, so `TINYTITAN_BENCH_MODEL` was a no-op and
        # the default named an install no one had pointed it at; it built
        # `language_model.model.layers.N` stems, which is the other family's
        # spelling, and died on a bare KeyError when the norm tensors it asks for
        # (`q_norm`, `k_norm`) turned out to be 0 of 1,079 entries in the install
        # measured here; it took every tensor as 4-bit where 98 of those 1,079 are
        # 8-bit by payload size, which raises on the layer router before a single
        # number is timed; there was no `try` anywhere in it, so the first raise
        # ended the sweep and nothing was written; the block output was picked by
        # `next()` over the model's outputs through a `names.index(n)` round-trip
        # rather than by shape; the artifact had no mkdir behind it and `json.dump`
        # wrote a NaN gap as a literal `NaN`, which is not RFC 8259; and it restated
        # the GPU reference instead of importing it, then multiplied the projection
        # by a layer count that is only true for the family it had hardcoded and
        # printed the result as a projected end-to-end prefill with no integration
        # overhead in it. It now reads the mask, the stem and the widths from the
        # install through `tools/ssdai_reader.py`, imports every geometry and
        # reference constant from the attention probe above, keeps a row that fails
        # in the row rather than the run, and returns its status through
        # `sys.exit(main())`. The real
        # rehearsal needs an ANE, a converted block and a model install, so CI runs
        # none of that: no model is loaded here, and the suite that proves the
        # driver's verdict cannot be reached by a run that measured nothing is what
        # is registered.
        # wall time was 22.5 s at load average 4.3 with the operator's own server still
        # listening on 8080, 19.1 s of it reported by the runner — the 22-suite list
        # measured 24.9 s at load 6.5 and 18.8 s at load 3 an hour earlier, so the
        # 32-58 s while the host sat at load average 16, so the
        # count is the claim and the timing is not. The 25-suite list measured 16.2 s
        # wall and 16.1 s reported at load average 2.7, and re-measured 16.7 s and 16.6 s
        # at load 4.8, both with the operator's server on 8080 and untouched. The
        # 26-suite list measured 20.4 s wall and 20.1 s reported at load average 4.0,
        # re-measured at 380 tests as 20.0 s and 19.8 s at load 4.6. Both with the
        # operator's server on 8080 and untouched. The 27-suite list measured 20.7 s
        # wall and 20.5 s reported at load average 3.7, again with the operator's
        # server on 8080 and untouched. The 28-suite list measured 24.7 s wall and
        # 24.4 s reported at load average 5.1, and re-measured 22.4 s and 22.1 s at
        # load 4.7, both with the operator's server on 8080 and untouched. The
        # 29-suite list measured 20.0 s wall and 19.8 s reported at load average 3.4,
        # and re-measured 19.2 s and 19.0 s at load 3.2, again with the operator's
        # server on 8080 and untouched. The 30-suite list — this one plus the
        # 3-bit probe — measured 17.9 s wall and 17.7 s reported at load average
        # 4.8, and nine further back-to-back runs reported 17.4-18.6 s at load
        # 4.7-6.3, all of them clean, with the operator's server on 8080 and
        # untouched. Adding the suite was itself caught by the registration gate
        # below: the first measurement run failed `test_this_repository_is_registered`
        # because `benchmark/test_tinytitan_3bit_probe.py` was named here and not yet
        # tracked, which is that gate working rather than misfiring. The 31-suite
        # list — this one plus the ANE attention probe, 595 tests — measured 21.3 s
        # wall and 21.1 s reported at load average 3.6, then 20.5 s and 20.4 s at
        # load 3.6, and 21.1 s a third time, all clean, with the operator's server
        # on 8080 and untouched. The 32-suite list — this one plus the real-weight
        # ANE rehearsal, 659 tests — measured 22.1 s wall and 21.8 s reported at load
        # average 3.1, then 21.7 s and 21.6 s at load 3.2, both clean, with the
        # operator's server on 8080 and untouched. Naming the suite before staging
        # its file was itself caught: `test_this_repository_is_registered` refuses a
        # CI name with no tracked `benchmark/test_*.py` behind it, which is that gate
        # working in the direction the first measurement run tested. The 33-suite
        # list — this one plus the M5 sweep, 682 tests — measured 23 s wall and 22.3 s
        # reported at load average 3.7, then 22 s and 21.6 s at load 3.8, and 21 s and
        # 21.8 s at load 3.9, all clean and all exit 0, with the operator's server on
        # 8080 and untouched.
        # test_tinytitan_m5_sweep drives the M5 tuning sweep's real main() with
        # `subprocess.run` patched, one reply per planned run, into a temp
        # directory. The sweep itself is minutes of cold CLI processes against a
        # real install, so CI runs none of it; what CI runs is the proof that the
        # verdict cannot be reached by a run that measured nothing. That file's
        # `def main():` had no return at all and its guard was a bare `main()`, so
        # a sweep in which every configuration errored exited 0; a
        # `KeyboardInterrupt` printed "interrupted -- writing partial results",
        # wrote the partial CSV, and fell through to that same 0. `--slots abc`
        # reached a bare `int()` -- a traceback rather than a refusal -- while
        # `--slots 0` was accepted and passed to the CLI, and the missing-CLI
        # refusal exited 1 through `sys.exit(str)` at the same time a sweep where
        # every run failed exited 0, so the two were not merely similar but
        # inverted. There was no output variable, unlike the three model-free
        # harnesses beside it, so the first test run of this suite wrote its
        # synthetic rows into benchmark/benchmark-results/ -- the directory is
        # git-ignored, but it is where the operator's real sweeps land, and the RED
        # run left a m5_sweep_results.csv there claiming 12.50 s prefills. The footer
        # printed "results written to <path>" with no count, so nothing in the log
        # separated one measured run from three planned ones, and the two sweeps'
        # pinned controls (chunk 4096, slots 64) were literals in each loop that the
        # section headers restated. It now plans the runs before starting any,
        # refuses a bad list with the flag named and status 2, honours
        # TINYTITAN_M5_SWEEP_OUT (repository-relative, so a launch from elsewhere
        # lands where it says), mkdirs behind the artifact, prints "N of M run(s)
        # measured" with a SWEEP COMPLETE or NOT MEASURED verdict, and returns its
        # status through `sys.exit(main())`.
        # test_memory_reports runs the seven `memory_*.py report` commands against
        # an empty results directory in-process -- no model, no server, no GGUF --
        # it exists because every one of them printed its table headers and exited 0
        # over a directory holding no run: `memory_projects` answered "Leaks, one line
        # each: none", which reads as two projects proven separate; `memory_mini`
        # printed its cost claim and the 89%/100% fidelity preamble; six drivers skipped
        # an arm that wrote nothing with `if not rows: continue`, so a report showing one
        # arm looked like the other had scored zero rather than never run;
        # `memory_master.aggregate()` printed pooled `carryable 0/0 n/a` rows for both
        # arms and then raised StatisticsError in `statistics.mean([])` over zero worlds;
        # `score_run([])` read `results[0]` and raised IndexError, so one empty run file
        # ended the report; and every guard called `report()` as a statement, so the
        # status the report now returns had nothing to reach.
        # registration of this list is now itself a gate:
        # `tools/docs-facts.py`'s `python_suite_registration()` refuses a tracked
        # `benchmark/test_*.py` named neither here nor in
        # `tools/python-suites-unrun.txt`, which is the file where a suite that
        # genuinely cannot run on a runner says why.
        # `test_concurrent_sessions_verdict` is here although its subject,
        # `test_concurrent_sessions.py`, is exempt: the harness needs a model
        # install and starts a server per model, but its `BASE=` branch -- the one
        # an operator runs against a server they already have -- is a verdict over
        # HTTP alone, and these tests drive that branch against a loopback stub.
        # It is the shape AUD-252 was: the launched path gated the separation
        # verdict on the canary and cancellation controls and the BASE path did
        # not, so a backend answering empty completions exited 0 as "no leaks".
        # No model, no server binary and nothing fetched.
        run: |
          cd benchmark
          python3 -m unittest test_internal_speeds test_quant_perplexity_ab \
            test_side_engine_judges test_tinytitan_prefetch_trace_analysis \
            test_memory_master test_memory_scenarios test_memval_master_exit \
            test_ornith_concise_tool_ab test_ornith_four_program_matrix \
            test_ane_prefill_ab_matrix test_ane_prefill_correctness \
            test_quant_quality_ab_exit test_docs_facts_suites test_memory_mini_report \
            test_tsan_storm_exit test_memory_command_names \
            test_driver_documented_commands test_capital_of_paris_report \
            test_tinytitan_determinism_ab test_tinytitan_overlap_measure \
            test_tinytitan_rdadvise_ab test_tinytitan_gap_bisect \
            test_capital_of_paris_smartness test_tinytitan_maxthroughput \
            test_tinytitan_slots_ab test_tinytitan_longgen \
            test_tinytitan_benchmark test_tinytitan_longctx test_memory_smoke \
            test_tinytitan_3bit_probe test_tinytitan_ane_attention_probe \
            test_tinytitan_ane_realweight_rehearsal \
            test_tinytitan_m5_sweep test_memory_reports \
            test_run_stamp_is_utc test_concurrent_sessions_verdict
      - name: T6 reply-check labels and the gate scorer
        # The reply-check measurement is only as good as its labels, and every
        # label comes from a detector a hand review already corrected. These
        # tests pin the traps that cost a wrong label (a negation, a
        # possessive, a rumour, the weather's weekday) and the gate's own
        # arithmetic. No model, no server, no dependencies.
        run: |
          cd benchmark
          python3 -m unittest test_t6_prose_cases
      - name: Run serial tests
        # `swift test` implicitly performs its own DEBUG build, which also
        # produces the `.build/debug/TinyTitanRepack` binary that RepackCLITests
        # spawns — no separate debug build step is needed.
        run: swift test --no-parallel
      - name: Check Markdown links
        run: |
          ruby - <<'RUBY'
          require 'set'
          Encoding.default_external = Encoding::UTF_8
          Encoding.default_internal = Encoding::UTF_8
          root = ENV.fetch('GITHUB_WORKSPACE', Dir.pwd)
          failures = 0
          checked = 0
          Dir.glob(File.join(root, '**', '*.md')).sort.each do |file|
            # Build output, the model store and installed dependencies are not
            # project docs. `node_modules` matters now that the JS toolchain is
            # installed before this step: a vendored package README is full of
            # links that are relative to its own repo, not to this one.
            next if file.include?('/.build/') || file.include?('/.qwen/') ||
                    file.include?('/node_modules/')
            dir = File.dirname(file)
            File.readlines(file).each_with_index do |line, index|
              line.scan(/\[[^\]]*\]\(([^)]+)\)/) do |match|
                target = match[0].strip
                next if target.empty?
                next if target.start_with?('http://', 'https://', '#', 'mailto:')
                target = target.split('#').first.to_s.gsub('%20', ' ')
                next if target.empty?
                path = File.expand_path(target, dir)
                checked += 1
                next if File.exist?(path)
                puts "#{file.delete_prefix(root + '/')}:#{index + 1}: broken link '#{target}'"
                failures += 1
              end
            end
          end
          puts "Checked #{checked} local link(s); #{failures} broken."
          exit(failures.zero? ? 0 : 1)
          RUBY

  # Separate job: the instrumented build plus the ~3.5x slower suite would
  # roughly double the main job's wall time, and its feedback is orthogonal to
  # a functional failure. Runs in parallel with `test`.
  thread-sanitizer:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: xcode-27
    env:
      # Exactly one suppression, scoped to the **top frame**: a Swift-concurrency
      # happens-before TSan does not model, reproduced under load on 2026-09-18.
      # `tools/tsan-suppressions.txt` carries the report, the reproduction and the
      # argument that the racy block is the drainer task's own frame rather than
      # `SSEOutbox` (whose fields are all lock-guarded). Anything in TinyTitan code
      # still has a TinyTitan top frame, so a real race still fails this job.
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/tsan-suppressions.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run serial tests under ThreadSanitizer
        run: swift test --no-parallel --sanitize=thread
