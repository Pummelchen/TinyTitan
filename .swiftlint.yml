# SwiftLint configuration for TinyTitan.
#
# The standard this project holds itself to: every Swift target builds in Swift 6
# language mode with complete strict concurrency and warnings-as-errors (enforced
# in Package.swift), and `swiftlint lint --strict` is part of `tools/lint.sh`, so
# a warning here fails the build the same way a compiler warning does.
#
# Two rule sets are deliberately NOT owned here, and neither is a waiver:
#
#   * formatting (trailing_comma, comma, colon, line_length,
#     vertical_parameter_alignment, opening_brace, vertical_whitespace,
#     trailing_newline, statement_position, switch_case_alignment,
#     closure_parameter_position, multiple_closures_with_trailing_closure,
#     control_statement) — `swift-format` is the single formatting owner, with a
#     committed configuration, and the two tools must not disagree about layout.
#     Duplicating layout in both is how a codebase ends up with two formatters.
#
#   * size/complexity (function_body_length, file_length, type_body_length,
#     cyclomatic_complexity, function_parameter_count, large_tuple, nesting) —
#     the repository already owns function complexity with its own ratchet:
#     `tools/lint.sh func-length` fails any NEW function over 120 lines and
#     baselines the existing ones. Re-enabling SwiftLint's stricter defaults here
#     would flag 672 pre-existing declarations (measured 2026-09-25) without
#     changing what is actually enforced; the ratchet is the standard, and these
#     rules stay delegated to it rather than being silently loosened.
#
# Everything else is on, including the safety rules below, and any finding they
# raise is fixed rather than configured away.

excluded:
  # Build output and the model store are not project source. The wiki has no
  # Swift in it either; all three are listed so a run from the repository root
  # cannot wander into them.
  - .build
  - models
  - .qwen
  # The consumer package under `examples/` is a SwiftPM root of its own, so its
  # build directory is not the repository's `.build` and the entry above does not
  # reach it. Without this line the gate lints the dependency checkouts SwiftPM
  # leaves there.
  - examples/embedded/.build

disabled_rules:
  # Layout, owned by swift-format.
  - trailing_whitespace
  - trailing_newline
  - trailing_comma
  - comma
  - colon
  - opening_brace
  - statement_position
  - control_statement
  - vertical_parameter_alignment
  - vertical_parameter_alignment_on_call
  - line_length
  - vertical_whitespace
  - switch_case_alignment
  - closure_parameter_position
  - multiple_closures_with_trailing_closure
  # Size and complexity, owned by tools/lint.sh's ratchet.
  - function_body_length
  - file_length
  - type_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - large_tuple
  - nesting

opt_in_rules:
  # The audit standard names this one, and the proof recorded when it was
  # adopted (AUD-005) shows a force unwrap failing this configuration.
  - force_unwrapping
  # The same crash class, declared rather than written with `!`.
  - implicitly_unwrapped_optional

identifier_name:
  # This is a numerical engine: `i`, `x`, `k`, `q`, `L`, `v`, `d` and `n` are
  # the names the maths uses, and 2,182 findings were all "should be between 3
  # and 40 characters". The lower bound is set to 1 rather than deleting the
  # rule: the upper bound, the allowed characters and the start-with-lowercase
  # check all still apply.
  min_length: 1
  max_length: 60
  # `L`, `D`, `E`, `N`, `K` and shapes like `Dv`/`FmoE` are the symbols the
  # maths uses (length, dimension, energy, count, kernel); 128 findings were all
  # "should start with a lowercase character". The character set and the length
  # window still apply.
  validates_start_with_lowercase: off
  # Underscores are deliberate in exactly six places and none of them is a
  # typo: the arch and catalogue constants mirror the model names they describe
  # (`qwen36_35B_A3B`, `qwen36_8bit`, `ornith15_8bit`), `where_` escapes the
  # keyword, and `_responseModelID`/`_activeTask` are the lock-backed storage
  # behind their computed properties in HTTPServerHandler. The length window,
  # the character set and the casing checks still apply, so a name with a
  # character outside letters/digits/underscore is still caught.
  allowed_symbols: "_"

type_name:
  # Types keep a real name; only the length window is widened to match the
  # engine's vocabulary (e.g. `SSDAIManifestV1`).
  min_length: 3
  max_length: 60

reporter: "xcode"
